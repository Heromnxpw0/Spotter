[project]
name = "spotterassessment"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "MMadi", email = "mohammedmadi935@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "lightgbm>=4.7.0",
    "matplotlib>=3.8,<4",
    "numpy>=1.26,<3",
    "pandas>=2.0,<3",
    "scikit-learn>=1.9.1",
]

[project.scripts]
spotterassessment = "spotterassessment:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
